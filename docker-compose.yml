services:
  postgres:
    image: 'postgres:16-alpine'
    container_name: englishcenter-db
    # Gia tri lay tu file .env (docker compose tu doc)
    environment:
      - 'POSTGRES_DB=${DB_NAME}'
      - 'POSTGRES_USER=${DB_USERNAME}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - englishcenter-network

  redis:
    image: 'redis:7-alpine'
    container_name: englishcenter-redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - englishcenter-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: englishcenter-app
    ports:
      - '8080:8080'
    # DB_USERNAME, DB_PASSWORD, JWT_SIGNER_KEY... lay tu .env
    env_file:
      - .env
    environment:
      # Trong mang docker, service name la hostname
      - 'DB_HOST=postgres'
      - 'DB_PORT=5432'
      - 'REDIS_HOST=redis'
      - 'REDIS_PORT=6379'
      # Flyway quan ly schema -> ddl-auto=none
      - 'SPRING_JPA_HIBERNATE_DDL_AUTO=none'
      - 'SPRING_JPA_SHOW_SQL=true'
      - 'SERVER_PORT=8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - englishcenter-network

volumes:
  postgres_data:
  redis_data:

networks:
  englishcenter-network:
    driver: bridge
