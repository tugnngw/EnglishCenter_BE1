spring.application.name=englishcenter

# Server Configuration
server.port=8080

# Database Configuration - use postgres superuser
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:englishcenter}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration - use postgres superuser
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.validate-on-migrate=false

# JWT Configuration
jwt.signer-key=${JWT_SIGNER_KEY}
jwt.access-token-expiry=900000
jwt.refresh-token-expiry=604800000

# Admin Account Initialization (from environment variables)
# Required for first-time setup:
# - admin.email: Admin email address
# - admin.password: Strong password for admin account
# Optional:
# - admin.full-name: Admin full name (default: System Administrator)
# - admin.phone: Admin phone number
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}
admin.full-name=${ADMIN_FULL_NAME:System Administrator}
admin.phone=${ADMIN_PHONE:}

# Docker Compose (disable for direct PostgreSQL connection)
spring.docker.compose.enabled=false