spring.application.name=englishcenter

# SePay QR checkout (credentials only in environment / Docker env_file)
sepay.webhook-secret=${SEPAY_WEBHOOK_SECRET:}
sepay.bank-code=${SEPAY_BANK_CODE:}
sepay.account-number=${SEPAY_ACCOUNT_NUMBER:}
sepay.account-name=${SEPAY_ACCOUNT_NAME:}
sepay.payment-prefix=${SEPAY_PAYMENT_PREFIX:EC}
sepay.order-expiry-minutes=${SEPAY_ORDER_EXPIRY_MINUTES:15}

# Doc bien moi truong tu file .env o thu muc goc project hoac thu muc module BE khi chay bang IDE
spring.config.import=optional:file:.env[.properties],optional:file:EnglishCenter_BE1/.env[.properties]

# Server Configuration
server.port=${PORT:8080}


spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:englishcenter}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration - dung chung credential voi datasource
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.validate-on-migrate=false

# Logging - hien thi Flyway migration logs
logging.level.org.flywaydb=DEBUG

# JWT Configuration
jwt.signer-key=${JWT_SIGNER_KEY:default-dev-key-change-in-production}
jwt.access-token-expiry=900000
jwt.refresh-token-expiry=604800000

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Docker Compose: project dang su dung PostgreSQL va Redis da cai truc tiep tren may
# nen KHONG tu dong start Docker Compose khi chay Spring Boot trong IDE.
# Dat thanh false vi:
#  - docker-compose.yml o thu muc D:\be-sba\EnglishCenter_BE1 nhung Spring Boot chay
#    voi working directory la D:\be-sba (project cha trong IDEA), dan den loi
#    java.lang.IllegalArgumentException: 'files' content [docker-compose.yml] must exist
#  - Docker Desktop chua khoi dong, khong the start services qua Docker.
# Neu muon bat lai Compose (VD chay bang docker compose up rieng, dam bao daemon len),
# set DOCKER_COMPOSE_ENABLED=true trong environment hoac doi sang true o day.
spring.docker.compose.enabled=${DOCKER_COMPOSE_ENABLED:false}
spring.docker.compose.file=docker-compose.yml
spring.docker.compose.lifecycle-management=start-only
spring.docker.compose.profiles.active=

# Exam (Dev 3)
# Thoi gian an han (giay) sau expires_at van cho phep nop bai (bu do tre mang)
exam.attempt.submit-grace-seconds=${EXAM_SUBMIT_GRACE_SECONDS:30}
# Job tu nop cac luot thi qua han
exam.sweeper.enabled=${EXAM_SWEEPER_ENABLED:true}
exam.sweeper.fixed-delay-ms=60000

# Dev 5 - Booking: phai huy / doi lich truoc gio hoc it nhat bao nhieu gio
app.booking.cancel-deadline-hours=24
# Dev 5 - Mentor doi lich buoi kem 1-1: phai doi truoc gio hoc it nhat bao nhieu gio (V26)
app.booking.reschedule-deadline-hours=2
# Dev 5 - Nhac lich: gui thong bao truoc gio hoc bao nhieu phut, job chay moi phut
app.booking.reminder-minutes-before=30
app.booking.reminder-job.enabled=${BOOKING_REMINDER_JOB_ENABLED:true}
app.booking.reminder-job.fixed-delay-ms=60000
# Dev 5: giới hạn khi mentor xếp buổi kèm 1-1 trong gói (chỉ xếp trong N ngày tới, mỗi buổi dài từ min tới max phút)
app.schedule.max-days-ahead=90
app.schedule.min-session-minutes=30
app.schedule.max-session-minutes=180
# Số buổi tối đa của 1 gói kèm 1-1
app.schedule.max-plan-sessions=60
# Dev 5 - WebSocket STOMP (/ws-connect): origin duoc phep bat tay, cach nhau dau phay
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:*}

# AI (cham Writing / Speaking + doc file de): Claude - Anthropic API, key chi dat trong .env
ai.claude.api-key=${ANTHROPIC_API_KEY:}
ai.claude.model=${CLAUDE_MODEL:claude-haiku-5-5}
ai.claude.base-url=${CLAUDE_BASE_URL:https://api.anthropic.com}
ai.claude.timeout-seconds=300

# Cloudinary: luu file bai tap / tai lieu dinh kem / file nghe (gia tri that chi dat trong .env)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.auth-key=${CLOUDINARY_AUTH_KEY:}
cloudinary.url-ttl-seconds=${CLOUDINARY_URL_TTL_SECONDS:900}

# Email local defaults use Gmail SMTP. On Render Free, set the Brevo SMTP
# relay host and port 2525 via Render environment variables.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from.email=${MAIL_FROM_EMAIL:${spring.mail.username:}}
mail.from.name=${MAIL_FROM_NAME:EnglishHub}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Link kich hoat tai khoan trong email tro ve FE
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.auth.activation-token-expiry-hours=${ACTIVATION_TOKEN_EXPIRY_HOURS:24}
