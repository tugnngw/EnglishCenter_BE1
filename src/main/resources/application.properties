spring.application.name=englishcenter

# SePay QR checkout (credentials only in environment / Docker env_file)
sepay.webhook-secret=${SEPAY_WEBHOOK_SECRET:}
sepay.bank-code=${SEPAY_BANK_CODE:}
sepay.account-number=${SEPAY_ACCOUNT_NUMBER:}
sepay.account-name=${SEPAY_ACCOUNT_NAME:}
sepay.payment-prefix=${SEPAY_PAYMENT_PREFIX:EC}
sepay.order-expiry-minutes=${SEPAY_ORDER_EXPIRY_MINUTES:15}

# Doc bien moi truong tu file .env o thu muc goc project (neu co) - tien khi chay bang IDE
spring.config.import=optional:file:.env[.properties]

# Server Configuration
server.port=8080


spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:englishcenter}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration - dung chung credential voi datasource
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.validate-on-migrate=false

# Logging - hien thi Flyway migration logs
logging.level.org.flywaydb=DEBUG

# JWT Configuration
jwt.signer-key=${JWT_SIGNER_KEY:default-dev-key-change-in-production}
jwt.access-token-expiry=900000
jwt.refresh-token-expiry=604800000

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Docker Compose: project dang su dung PostgreSQL va Redis da cai truc tiep tren may
# nen KHONG tu dong start Docker Compose khi chay Spring Boot trong IDE.
# Dat thanh false vi:
#  - docker-compose.yml o thu muc D:\be-sba\EnglishCenter_BE1 nhung Spring Boot chay
#    voi working directory la D:\be-sba (project cha trong IDEA), dan den loi
#    java.lang.IllegalArgumentException: 'files' content [docker-compose.yml] must exist
#  - Docker Desktop chua khoi dong, khong the start services qua Docker.
# Neu muon bat lai Compose (VD chay bang docker compose up rieng, dam bao daemon len),
# set DOCKER_COMPOSE_ENABLED=true trong environment hoac doi sang true o day.
spring.docker.compose.enabled=${DOCKER_COMPOSE_ENABLED:false}
spring.docker.compose.file=docker-compose.yml
spring.docker.compose.lifecycle-management=start-only
spring.docker.compose.profiles.active=

# Exam (Dev 3)
# Thoi gian an han (giay) sau expires_at van cho phep nop bai (bu do tre mang)
exam.attempt.submit-grace-seconds=${EXAM_SUBMIT_GRACE_SECONDS:30}
# Job tu nop cac luot thi qua han
exam.sweeper.enabled=${EXAM_SWEEPER_ENABLED:true}
exam.sweeper.fixed-delay-ms=60000

# Dev 5 - Booking: phai huy / doi lich truoc gio hoc it nhat bao nhieu gio
app.booking.cancel-deadline-hours=24
# Dev 5 - Nhac lich: gui thong bao truoc gio hoc bao nhieu phut, job chay moi phut
app.booking.reminder-minutes-before=30
app.booking.reminder-job.enabled=${BOOKING_REMINDER_JOB_ENABLED:true}
app.booking.reminder-job.fixed-delay-ms=60000
# Dev 5 - Lich hoc ca nhan: job nhac moi phut
app.study-schedule.reminder-job.enabled=${STUDY_REMINDER_JOB_ENABLED:true}
app.study-schedule.reminder-job.fixed-delay-ms=60000
# Dev 5 - WebSocket STOMP (/ws-connect): origin duoc phep bat tay, cach nhau dau phay
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:*}

# Dev 5 - AI cham bai luyen tap (TASK-D5-04): Google Gemini, key chi dat trong .env
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
ai.gemini.timeout-seconds=60
