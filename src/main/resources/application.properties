spring.application.name=englishcenter

# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:englishcenter}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration - dung chung credential voi datasource
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.validate-on-migrate=false

# Logging - hien thi Flyway migration logs
logging.level.org.flywaydb=DEBUG

# JWT Configuration
jwt.signer-key=${JWT_SIGNER_KEY:default-dev-key-change-in-production}
jwt.access-token-expiry=900000
jwt.refresh-token-expiry=604800000

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Docker Compose - auto start PostgreSQL + Redis khi chay dev
spring.docker.compose.enabled=${DOCKER_COMPOSE_ENABLED:true}
spring.docker.compose.file=docker-compose.yml
spring.docker.compose.lifecycle-management=start-only
spring.docker.compose.profiles.active=